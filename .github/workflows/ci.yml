name: Build and test DIFMAP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up taps
        run: |
          brew update
          brew tap kazuakiyama/pgplot
          # Clone the checked-out commit so pull requests test their own formula.
          brew tap --custom-remote kazuakiyama/difmap "$GITHUB_WORKSPACE"
          brew config

      - name: Build and test PGPLOT
        run: |
          brew install --build-from-source kazuakiyama/pgplot/pgplot
          brew test kazuakiyama/pgplot/pgplot

      - name: Build and test DIFMAP
        run: |
          brew install --build-from-source --verbose kazuakiyama/difmap/difmap
          brew test kazuakiyama/difmap/difmap

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-logs-${{ matrix.os }}
          path: ~/Library/Logs/Homebrew
          if-no-files-found: ignore
